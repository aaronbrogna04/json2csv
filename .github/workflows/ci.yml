name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Version y build
        run: echo "VERSION $(cat VERSION) - BUILD $(cat BUILD) - run ${{ github.run_number }}"
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: pydocstyle (PEP257)
        run: pydocstyle --convention=pep257 src tests
      - name: mypy
        run: mypy
      - name: pyright
        run: pyright
      - name: bandit
        run: bandit -r src
      - name: pytest (cobertura >= 85 %)
        run: pytest
      - name: Documentacion con pdoc
        run: pdoc -o docs/api json2csv
      - name: Publicar documentacion
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/api
