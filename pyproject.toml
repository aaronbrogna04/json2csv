[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json2csv"
version = "0.1.0"
description = "Herramienta de línea de comandos para convertir archivos JSON a CSV"
readme = "README.md"
authors = [{name = "Aaron Brogna", email = "aaronbrogna46@gmail.com"}]
maintainers = [{name = "Aaron Brogna", email = "aaronbrogna46@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = []
requires-python = ">= 3.12"

[project.urls]
bugs = "https://github.com/aaronbrogna04/json2csv/issues"
homepage = "https://github.com/aaronbrogna04/json2csv"

[project.scripts]
json2csv = "json2csv.json2csv:main"

[tool.hatch.build.targets.wheel]
packages = ["src/json2csv"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=json2csv --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
